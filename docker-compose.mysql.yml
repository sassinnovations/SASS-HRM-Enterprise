name: sass_hrm_real
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run SETUP_SASS_HRM.bat}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run SETUP_SASS_HRM.bat}
      MYSQL_USER: ${MYSQL_USER:?Run SETUP_SASS_HRM.bat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run SETUP_SASS_HRM.bat}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - sass_hrm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  sass_hrm_mysql_data:
