<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102447" />
  <title>SASS HRM Enterprise | The People Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <style>
    .sass-boot-failure {min-height:100vh; display:grid; place-items:center; background:#f7f9fd; font-family:system-ui,sans-serif; color:#1d2941; padding:24px}
    .sass-boot-failure section {width:min(640px,100%); background:#fff; border:1px solid #e1e7f1; border-radius:16px; padding:32px; box-shadow:0 12px 40px #1c306010}
    .sass-boot-failure h1 {font-size:24px; margin:0 0 12px}
    .sass-boot-failure p {line-height:1.6; color:#53617a}
    .sass-boot-failure pre {white-space:pre-wrap; overflow-wrap:anywhere; background:#fff3f3; color:#9b243d; padding:14px; border-radius:8px}
    .sass-boot-failure button {background:#555ce2; color:white; border:0; border-radius:8px; padding:12px 18px; cursor:pointer}
  </style>
  <script>
    // Independent of React/Vite: errors during module loading otherwise leave a blank page.
    (function () {
      var firstError = '';
      function showFailure(message) {
        var root = document.getElementById('root');
        if (!root || root.firstElementChild) return;
        var panel = document.createElement('main');
        panel.className = 'sass-boot-failure';
        panel.setAttribute('role', 'alert');
        var section = document.createElement('section');
        var heading = document.createElement('h1');
        heading.textContent = 'SASS HRM could not start';
        var description = document.createElement('p');
        description.textContent = 'The browser loaded the page, but the React application did not mount. Check the error below and open Chrome DevTools (F12 > Console).';
        var detail = document.createElement('pre');
        detail.textContent = message || 'No error details were reported. Check the frontend terminal for a Vite or dependency error.';
        var hints = document.createElement('p');
        hints.textContent = 'Try REPAIR_FRONTEND.bat from the downloaded project, then refresh the page.';
        var button = document.createElement('button');
        button.textContent = 'Retry loading';
        button.addEventListener('click', function () { location.reload(); });
        section.append(heading, description, detail, hints, button);
        panel.appendChild(section);
        root.replaceChildren(panel);
      }
      window.addEventListener('error', function (event) {
        if (!firstError) firstError = event.message || (event.target && event.target.src ? 'Unable to load: ' + event.target.src : 'Script resource failed to load');
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (!firstError) firstError = String(event.reason && event.reason.message || event.reason || 'Unhandled promise rejection');
      });
      setTimeout(function () { showFailure(firstError); }, 5500);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Enable JavaScript in your browser to use SASS HRM Enterprise.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
